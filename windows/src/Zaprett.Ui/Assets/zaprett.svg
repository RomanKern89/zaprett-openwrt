<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- zaprett mark: a "Z" whose diagonal is split in two, like a packet cut by the bypass. MIT. -->
  <title>zaprett</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#1B4DB8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#g)"/>
  <g stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round" fill="none">
    <line x1="27" y1="28.5" x2="73" y2="28.5"/>
    <line x1="27" y1="71.5" x2="73" y2="71.5"/>
    <line x1="70" y1="31" x2="54.5" y2="46.5"/>
    <line x1="45.5" y1="53.5" x2="30" y2="69"/>
  </g>
</svg>
